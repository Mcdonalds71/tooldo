name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CLASH_DISPLAY_URL is a repository secret, so a pull request from a fork builds
# without it and headings fall back to the system sans. That is the intended
# outcome — see public/fonts/README.md — and never a failing check.

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          CLASH_DISPLAY_URL: ${{ secrets.CLASH_DISPLAY_URL }}

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        # The suite builds the site before serving it, so it needs the font too.
      - run: pnpm test:e2e
        env:
          CLASH_DISPLAY_URL: ${{ secrets.CLASH_DISPLAY_URL }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
