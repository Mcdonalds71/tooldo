# Install scripts run only for the dependencies listed here. Anything else that asks
# is a supply-chain decision to make deliberately, not a prompt to click through.
# Both of these are patched upstream but reach us through a dependency that hasn't
# picked the fix up yet. Neither ships to a visitor — undici arrives via wrangler's
# local runtime, fast-uri via the YAML language server behind astro check — so the
# override is about keeping the audit honest, not about closing a live hole.
# Drop each one once its parent releases past it.
#
# onnxruntime-node is different: transformers.js declares it as a hard dependency for
# its Node.js code path, but tooldo never runs that path — the whole suite is browser
# and Worker only. The real package is a multi-platform native binary bundle that timed
# out fetching in this environment and buys nothing even when it succeeds, so it's
# redirected to a local stub that throws if anything ever actually imports it.
#
# The last three are the same shape as the first two — patched upstream, reaching us
# through a parent that hasn't bumped yet, none of them on a path a visitor executes.
# sharp arrives via transformers.js's Node image path (which this suite never takes,
# and the repo already asks for a fixed sharp of its own for the brand-asset script);
# js-yaml and nanoid arrive under Astro's build tooling. `pnpm audit --audit-level high`
# gates CI, so leaving them unpinned blocks every pull request over code nobody ships.
overrides:
  undici: '>=7.29.0'
  fast-uri: '>=3.1.5'
  onnxruntime-node: 'link:./scripts/stubs/onnxruntime-node'
  # Upper bounds are not decoration. Left open, these resolve to the newest major —
  # js-yaml 5 drops the default export Astro imports, and nanoid 6 is ESM-only where
  # postcss still requires it — so an override meant to silence an advisory breaks the
  # build instead. Pin to the patch inside the major each parent already expects.
  sharp: '>=0.35.0 <0.36.0'
  js-yaml: '>=4.3.1 <5'
  nanoid: '>=3.3.17 <4'

allowBuilds:
  esbuild: true
  # Brought in by onnxruntime-web to parse .onnx files (protobuf-encoded). Its install
  # step generates JS from the .proto schemas bundled in the package itself — local
  # codegen, no network fetch or native binary.
  protobufjs: true
  sharp: true
  # Wrangler shells out to workerd, whose install script fetches the platform binary.
  # Skip it and the deploy step fails on a runtime that never finished installing.
  workerd: true
